purpose:
  stands_in_for: MKVDrama public HTML pages and cookie-bound encrypted download access.
  unblocks: Local verification of the production Kotlin HTTP session and parsers without live challenges or media requests.
assumptions:
  - id: public-html-without-catalog-api-key
    status: supported
    claim: The sampled catalog, search, movie, and drama pages expose cards or title metadata with an HTML Accept header without an MKVDrama API key.
    reason: Live pages returned HTTP 200 in a browser-backed session; captured public markup drives the parser tests. Cloudflare clearance can still be required.
    verification: On 2026-11-01, captured the five pages listed in the fixture README. JSON search returned 401 Invalid API key while HTML search returned 24 cards. Production session tests against the local HTML stand-ins parsed catalog and movie metadata; the simulation log recorded HTML Accept on both requests and 401 on the deliberate JSON request. This verifies caller behavior against the stand-ins, not Cloudflare handling on Android.
    source: MkvDrama/src/test/resources/mkvdrama/README.md; MkvDrama/src/test/kotlin/com/nropvox/MkvDramaParserTest.kt; MkvDrama/src/test/kotlin/com/nropvox/MkvDramaTest.kt; MkvDrama/postman/mocks/series/default.js
    updated_at: "2026-11-01"
  - id: encrypted-download-access
    status: supported
    claim: The current series script uses a cookie-bound seed, gate, and pass exchange with authenticated AES-GCM panel payloads.
    reason: The live series bundle SHA-256 was 3ef1fdce262e4e2ed4cbc1476a7d48c4b4f72f9a511e4f41fb77b8714bc0741f, matching the adjacent reference client's captured script. That reference client unlocked the live Bad Genius panel. The existing mock uses invented cookies and keys to model this protocol.
    verification: On 2026-11-01, the updated Kotlin session unlocked the stand-in using an already fetched page. Its state showed one initial title GET followed by seed, gate, pass, and a redirect request. Tests rejected ciphertext tampering, invalid seed paths, invalid cookies, and verification errors. This does not establish live Kotlin playback or shortener completion.
    source: https://mkvdrama.net/static/js/dist/series.bundle.js?v=3ef1fdce262e; MkvDrama/src/test/kotlin/com/nropvox/MkvDramaTest.kt; MkvDrama/postman/mocks/series/default.js
    updated_at: "2026-11-01"
fingerprints:
